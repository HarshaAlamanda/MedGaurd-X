services:
  - type: web
    name: medgaurd-x
    runtime: python
    buildCommand: apt-get install -y tesseract-ocr libgl1-mesa-glx libglib2.0-0 && pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MEDGUARD_SECRET
        generateValue: true
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: FRONTEND_URL
        sync: false
